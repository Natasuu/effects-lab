      const p = c.ptr, R = c.cfg.radius, S = c.cfg.strength, dur = c.cfg.duration ?? 0.45;
      cards.forEach((n) => {
        const cornerX = n.L.x + n.L.w, cornerY = n.L.y;
        const l = p.inside ? lin(Math.hypot(p.x - cornerX, p.y - cornerY), R * 1.1) : 0;
        const want = l > 0.08;
        if (want === n.hot && want) {
          const peel = 18 * S * Math.max(l, 0.4);
          gsap.to(n.flap, { rotation: -peel, duration: 0.18, ease: "power2.out", overwrite: true });
          gsap.to(n.back, { rotation: peel, opacity: 0.85 * l, duration: 0.18, ease: "power2.out", overwrite: true });
          n.flap.style.filter = `drop-shadow(-4px 6px 8px rgba(34,49,78,${0.28 * l}))`;
          return;
        }
        if (want === n.hot) return;
        n.hot = want;
        gsap.to(n.flap, { rotation: want ? -16 * S : 0, duration: dur, ease: want ? "power2.out" : "power2.inOut", overwrite: true });
        gsap.to(n.back, { rotation: want ? 16 * S : 0, opacity: want ? 0.8 : 0, duration: dur, overwrite: true });
        n.flap.style.filter = want ? "drop-shadow(-4px 6px 8px rgba(34,49,78,0.28))" : "none";
      });
      return p.inside || cards.some((n) => gsap.isTweening(n.flap));
    },
  };
}

function nearestLayer(c, x, y) {
  let best = null, bd = 1e9;
  if (!c.layers) return { L: null, d: bd };
  for (const L of c.layers) {
    const ddx = Math.max(L.x - x, 0, x - (L.x + L.w));
    const ddy = Math.max(L.y - y, 0, y - (L.y + L.h));
    const d = Math.hypot(ddx, ddy);
    if (d < bd) { bd = d; best = L; }
  }
  return { L: best, d: bd };
}

/* Cursor family: the artwork stays put. A custom cursor is what changes. */
function cursorFx(c, mode) {
  let root, el, extras = [], cx = 0, cy = 0, rx = 0, ry = 0, ix = 0, iy = 0;
  let amt = 0, over = 0, ang = 0, stuck = 0, press = 0, wasDown = false;
  let mx = 0, my = 0, mw = 36, mh = 36, mr = 18, ripples = [];
  const mk = (cls, html) => {
    const n = document.createElement("div");
    n.className = cls;
    if (html) n.innerHTML = html;
    root.appendChild(n);
    return n;
  };
  const hitInk = () => {
    const d = c.compositeData();
    const x = Math.round(c.ptr.x * DPR), y = Math.round(c.ptr.y * DPR);
    if (x < 0 || y < 0 || x >= d.width || y >= d.height) return 0;
    return d.data[(y * d.width + x) * 4 + 3] > 24 ? 1 : 0;
  };
  return {
    init() {
      if (c._curRoot) c._curRoot.remove();
      if (mode === "halo") c.stage.classList.add("has-halo");
      else c.stage.classList.add("has-cursor");
      root = document.createElement("div");
      root.className = "cur-root";
      c.stage.appendChild(root);
      c._curRoot = root;
      extras = [];
      ripples = [];
      if (mode === "dot") el = mk("cur-dot");
      else if (mode === "label" || mode === "view") {
        el = mk("cur-label", `<span class="cur-mark"></span><span class="cur-txt">${mode === "view" ? "View" : "Go to case study"}</span>`);
      } else if (mode === "invert") el = mk("cur-invert");
      else if (mode === "trail") {
        extras = Array.from({ length: 14 }, () => {
          const n = mk("cur-dot cur-trail");
          return { n, x: c.W / 2, y: c.H / 2 };
        });
        el = extras[0].n;
      } else if (mode === "stretch") el = mk("cur-dot");
      else if (mode === "snap") el = mk("cur-dot");
      else if (mode === "play") el = mk("cur-play", "<i></i>");
      else if (mode === "plus") el = mk("cur-plus", "<b></b><b></b>");
      else if (mode === "arrow") el = mk("cur-arrow");
      else if (mode === "orbit") {
        el = mk("cur-dot");
        extras = [mk("cur-sat"), mk("cur-sat")];
      } else if (mode === "twospeed") {
        el = mk("cur-ring");
        extras = [mk("cur-dot")];
      } else if (mode === "grow") el = mk("cur-ring");
      else if (mode === "sticky") {
        el = mk("cur-ring");
        extras = [mk("cur-dot")];
      } else if (mode === "morph") el = mk("cur-morph");
      else if (mode === "inner") {
        el = mk("cur-ring");
        extras = [mk("cur-inner", "View")];
      } else if (mode === "stack") {
        extras = [0, 1, 2, 3].map((i) => {
          const n = mk("cur-invert");
          n.style.opacity = String(0.22 + i * 0.12);
          return { n, x: c.W / 2, y: c.H / 2 };
        });
        el = extras[0].n;
      } else if (mode === "backdrop") el = mk("cur-invert-filter");
      else if (mode === "halo") el = mk("cur-halo");
      else if (mode === "cross") {
        extras = [mk("cur-cross-h"), mk("cur-cross-v")];
        el = extras[0];
      } else if (mode === "distort") {
        const id = "cur-turb-" + c.index;
        el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        el.setAttribute("class", "cur-svg");
        el.setAttribute("width", "72");
        el.setAttribute("height", "72");
        el.innerHTML = `<defs><filter id="${id}"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter></defs><circle cx="36" cy="36" r="16" fill="none" stroke="#22314e" stroke-width="2.2" filter="url(#${id})"/>`;
        root.appendChild(el);
      } else if (mode === "click") {
        el = mk("cur-dot");
      } else if (mode === "media") {
        el = mk("cur-media", "<canvas></canvas>");
      } else if (mode === "hud") el = mk("cur-hud");
      cx = rx = ix = mx = c.W / 2; cy = ry = iy = my = c.H / 2;
      amt = 0; over = 0; ang = 0; stuck = 0; press = 0; wasDown = false;
    },
    step(f) {
      c.clear();
      c.ctx.drawImage(c.composite(), 0, 0, c.W, c.H);
      const p = c.ptr, S = c.cfg.strength, scale = c.cfg.radius / 130;
      amt += ((p.inside ? 1 : 0) - amt) * 0.2 * f;
      over += (((p.inside && hitInk()) ? 1 : 0) - over) * 0.18 * f;
      const near = p.inside ? nearestLayer(c, p.x, p.y) : { L: null, d: 1e9 };
      let tx = p.inside ? p.x : cx, ty = p.inside ? p.y : cy;
      if (mode === "snap" && near.L && near.d < c.cfg.radius * 0.9) {
        const t = (1 - near.d / (c.cfg.radius * 0.9)) * 0.62 * S;
        tx = p.x + (near.L.cx - p.x) * t;
        ty = p.y + (near.L.cy - p.y) * t;
      }
      const wantStick = (mode === "sticky" || mode === "morph") && near.L && near.d < 10;
      stuck += ((wantStick ? 1 : 0) - stuck) * 0.16 * f;
      if (mode === "sticky" && wantStick) { tx = near.L.cx; ty = near.L.cy; }
      const lag = clamp(0.18 + (1.2 - Math.min(S, 1.6)) * 0.16, 0.12, 0.45);
      const k = 1 - Math.pow(1 - lag, f);
      const ox = cx, oy = cy;
      cx += (tx - cx) * k;
      cy += (ty - cy) * k;
      rx += ((p.inside ? p.x : rx) - rx) * (1 - Math.pow(1 - 0.16, f));
      ry += ((p.inside ? p.y : ry) - ry) * (1 - Math.pow(1 - 0.16, f));
      ix += (cx - ix) * (1 - Math.pow(1 - 0.1, f));
      iy += (cy - iy) * (1 - Math.pow(1 - 0.1, f));
      const vx = cx - ox, vy = cy - oy;
      const spd = Math.hypot(vx, vy);
      if (spd > 0.15) ang += (Math.atan2(vy, vx) - ang) * 0.28 * f;
      if (p.down && !wasDown) {
        press = 1;
        ripples.push({ x: p.x, y: p.y, r: 8, life: 1 });
      }
      wasDown = p.down;
      press += (0 - press) * 0.18 * f;
      const hide = amt < 0.03;
      const place = (node, x, y, extra) => {
        node.style.opacity = hide ? "0" : String(amt);
        node.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)${extra || ""}`;
      };
      if (mode === "dot" || mode === "snap") {
        const s = (9 + 20 * over) * (0.75 + 0.4 * S) * scale;
        el.style.width = el.style.height = s + "px";
        place(el, cx, cy, ` scale(${amt})`);
      } else if (mode === "label" || mode === "view") {
        el.classList.toggle("open", amt > 0.2);
        place(el, cx, cy, ` scale(${0.86 + 0.14 * amt})`);
      } else if (mode === "invert") {
        const s = (28 + 36 * over) * scale * (0.7 + 0.4 * S);
        el.style.width = el.style.height = s + "px";
        place(el, cx, cy, ` scale(${amt})`);
      } else if (mode === "trail") {
        const nShow = Math.round(c.cfg.ghosts ?? 7);
        extras.forEach((t, i) => {
          if (i >= nShow) { t.n.style.opacity = "0"; return; }
          if (i === 0) { t.x = cx; t.y = cy; }
          else {
            const lk = clamp(0.42 - i * 0.035, 0.08, 0.5) * f;
            t.x += (cx - t.x) * lk;
            t.y += (cy - t.y) * lk;
          }
          const s = (14 - i * 1.1) * scale;
          t.n.style.width = t.n.style.height = Math.max(4, s) + "px";
          t.n.style.opacity = hide ? "0" : String(amt * (1 - i / nShow) * 0.85);
          t.n.style.transform = `translate(${t.x}px, ${t.y}px) translate(-50%, -50%)`;
        });
      } else if (mode === "stretch") {
        const len = 1 + Math.min(spd / 14, 2.1) * S;
        const s = (12 + 10 * over) * scale;
        el.style.width = el.style.height = s + "px";
        el.style.borderRadius = "50%";
        place(el, cx, cy, ` rotate(${ang * 180 / Math.PI}deg) scale(${len}, ${1 / Math.sqrt(len)})`);
      } else if (mode === "play") {
        const s = (40 + 10 * over) * scale * (0.85 + 0.2 * S);
        el.style.width = el.style.height = s + "px";
        place(el, cx, cy, ` scale(${amt})`);
      } else if (mode === "plus") {
        place(el, cx, cy, ` rotate(${over * 45}deg) scale(${amt})`);
      } else if (mode === "arrow") {
        place(el, cx, cy, ` rotate(${ang * 180 / Math.PI}deg) scale(${amt})`);
      } else if (mode === "orbit") {
        const s = (10 + 8 * over) * scale;
        el.style.width = el.style.height = s + "px";
        place(el, cx, cy, ` scale(${amt})`);
        const now = performance.now() / 1000;
        const r = (12 + 12 * (c.cfg.orbit ?? 1.3)) * scale;
        extras.forEach((n, i) => {
          const a = now * (1.8 + S) + i * Math.PI;
          n.style.opacity = hide ? "0" : String(amt);
          n.style.transform = `translate(${cx + Math.cos(a) * r}px, ${cy + Math.sin(a) * r}px) translate(-50%, -50%)`;
        });
      } else if (mode === "twospeed") {
        const ds = 8 * scale, rs = (32 + 10 * over) * scale;
        extras[0].style.width = extras[0].style.height = ds + "px";
        extras[0].style.opacity = hide ? "0" : String(amt);
        extras[0].style.transform = `translate(${p.inside ? p.x : cx}px, ${p.inside ? p.y : cy}px) translate(-50%, -50%)`;
        el.style.width = el.style.height = rs + "px";
        place(el, rx, ry);
      } else if (mode === "grow") {
        const s = (34 + 22 * over) * scale * (0.85 + 0.2 * S);
        el.style.width = el.style.height = s + "px";
        place(el, cx, cy, ` scale(${amt})`);
      } else if (mode === "sticky") {
        const base = 30 * scale;
        const grow = near.L ? Math.max(near.L.w, near.L.h) * 0.92 : base;
        const s = base + (grow - base) * stuck;
        const jx = stuck > 0.85 ? (Math.sin(performance.now() * 0.012) * 2.4) : 0;
        const jy = stuck > 0.85 ? (Math.cos(performance.now() * 0.017) * 2.4) : 0;
        el.style.width = el.style.height = s + "px";
        place(el, cx + jx, cy + jy);
        extras[0].style.width = extras[0].style.height = 7 * scale + "px";
        extras[0].style.opacity = hide ? "0" : String(amt);
        extras[0].style.transform = `translate(${p.inside ? p.x : cx}px, ${p.inside ? p.y : cy}px) translate(-50%, -50%)`;
      } else if (mode === "morph") {
        const tw = near.L && wantStick ? near.L.w + 10 : 36 * scale;
        const th = near.L && wantStick ? near.L.h + 10 : 36 * scale;
        const txx = near.L && wantStick ? near.L.x - 5 : cx - tw / 2;
        const tyy = near.L && wantStick ? near.L.y - 5 : cy - th / 2;
        const tr = near.L && wantStick ? 4 : tw / 2;
        const mk2 = 1 - Math.pow(1 - 0.2, f);
        mx += (txx - mx) * mk2; my += (tyy - my) * mk2;
        mw += (tw - mw) * mk2; mh += (th - mh) * mk2; mr += (tr - mr) * mk2;
        el.style.width = mw + "px"; el.style.height = mh + "px";
        el.style.borderRadius = mr + "px";
        el.style.opacity = hide ? "0" : String(amt);
        el.style.transform = `translate(${mx}px, ${my}px)`;
      } else if (mode === "inner") {
        const s = (44 + 10 * over) * scale;
        el.style.width = el.style.height = s + "px";
        place(el, cx, cy);
        extras[0].style.opacity = hide ? "0" : String(amt * (0.35 + 0.65 * over));
        extras[0].style.transform = `translate(${ix}px, ${iy}px) translate(-50%, -50%)`;
      } else if (mode === "stack") {
        extras.forEach((t, i) => {
          if (i === 0) { t.x = cx; t.y = cy; }
          else {
            const lk = (0.18 - i * 0.03) * f;
            t.x += (cx - t.x) * Math.max(0.04, lk);
            t.y += (cy - t.y) * Math.max(0.04, lk);
          }
          const s = (26 + 40 * over - i * 3) * scale;
          t.n.style.width = t.n.style.height = Math.max(10, s) + "px";
          t.n.style.opacity = hide ? "0" : String(amt * (0.28 + i * 0.12));
          t.n.style.transform = `translate(${t.x}px, ${t.y}px) translate(-50%, -50%)`;
        });
      } else if (mode === "backdrop") {
        const s = (36 + 28 * over) * scale;
        el.style.width = el.style.height = s + "px";
        place(el, cx, cy, ` scale(${amt})`);
      } else if (mode === "halo") {
        const s = (42 + 16 * over) * scale;
        el.style.width = el.style.height = s + "px";
        place(el, rx, ry);
      } else if (mode === "cross") {
        extras[0].style.top = cy + "px";
        extras[1].style.left = cx + "px";
        extras[0].style.opacity = extras[1].style.opacity = hide ? "0" : String(amt * 0.5);
      } else if (mode === "distort") {
        const turb = el.querySelector("feTurbulence");
        if (turb) turb.setAttribute("baseFrequency", String(0.035 + 0.04 * over + 0.01 * Math.sin(performance.now() * 0.004)));
        el.style.opacity = hide ? "0" : String(amt);
        el.style.transform = `translate(${cx - 36}px, ${cy - 36}px) scale(${0.9 + 0.35 * over})`;
      } else if (mode === "click") {
        const s = (12 + 8 * over) * scale * (1 - 0.35 * press);
        el.style.width = el.style.height = s + "px";
        place(el, cx, cy, ` scale(${amt})`);
        ripples = ripples.filter((r) => r.life > 0.04);
        ripples.forEach((r) => {
          r.r += 2.8 * f * S;
          r.life -= 0.035 * f;
          let node = r.node;
          if (!node) { node = mk("cur-ripple"); r.node = node; }
          node.style.width = node.style.height = r.r * 2 + "px";
          node.style.opacity = String(r.life * amt);
          node.style.transform = `translate(${r.x}px, ${r.y}px) translate(-50%, -50%)`;
        });
      } else if (mode === "media") {
        const canvas = el.querySelector("canvas");
        const L = near.L;
        if (canvas && L && over > 0.15) {
          const g = canvas.getContext("2d");
          canvas.width = 184; canvas.height = 116;
          g.fillStyle = "#e9ecf5";
          g.fillRect(0, 0, 184, 116);
          const z = Math.min(160 / L.w, 92 / L.h);
          g.drawImage(L.c, (184 - L.w * z) / 2, (116 - L.h * z) / 2, L.w * z, L.h * z);
        }
        el.style.opacity = hide ? "0" : String(amt * (0.2 + 0.8 * over));
        el.style.transform = `translate(${cx + 18}px, ${cy - 8}px)`;
      } else if (mode === "hud") {
        el.textContent = `${Math.round(p.x).toString().padStart(3, "0")}  ${Math.round(p.y).toString().padStart(3, "0")}`;
        place(el, cx + 16, cy + 22);
      }
      if (mode !== "click") {
        ripples.forEach((r) => { if (r.node) r.node.remove(); });
        ripples = [];
      }
      return p.inside || amt > 0.02 || ripples.length > 0;
    },
  };
}

function cursorDrawFx(c, mode) {
  let ov, g, pts = [], stamps = [], fade, lastX = 0, lastY = 0, travel = 0, amt = 0;
  const pushPt = (x, y) => {
    pts.unshift({ x, y });
    const cap = mode === "harmony" ? 90 : mode === "ribbon" ? 28 : 48;
    if (pts.length > cap) pts.length = cap;
  };
  return {
    init() {
      if (c._curRoot) c._curRoot.remove();
      c.stage.classList.add("has-cursor");
      const root = document.createElement("div");
      root.className = "cur-root";
      ov = document.createElement("canvas");
      ov.className = "cur-draw";
      ov.width = c.W * DPR; ov.height = c.H * DPR;
      g = ov.getContext("2d");
      root.appendChild(ov);
      c.stage.appendChild(root);
      c._curRoot = root;
      pts = []; stamps = [];
      fade = document.createElement("canvas");
      fade.width = ov.width; fade.height = ov.height;
      lastX = c.W / 2; lastY = c.H / 2; travel = 0; amt = 0;
    },
    step(f) {
      c.clear();
      c.ctx.drawImage(c.composite(), 0, 0, c.W, c.H);
      const p = c.ptr, S = c.cfg.strength, scale = c.cfg.radius / 130;
      amt += ((p.inside ? 1 : 0) - amt) * 0.2 * f;
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      g.clearRect(0, 0, c.W, c.H);
      if (p.inside) {
        const step = Math.hypot(p.x - lastX, p.y - lastY);
        travel += step;
        if (mode === "goo" || mode === "ribbon" || mode === "rgb" || mode === "comet" || mode === "harmony") {
          if (!pts.length || step > 1.2) pushPt(p.x, p.y);
        }
        if (mode === "smoke" && step > 1.6) {
          stamps.push({ x: p.x, y: p.y, r: 6 + 8 * rnd(), life: 1, kind: "smoke" });
        }
        if (mode === "stamp" && travel > (c.cfg.gap ?? 14)) {
          travel = 0;
          stamps.push({ x: p.x, y: p.y, r: 5 * scale, life: 1, rot: rnd() * 6, kind: "stamp" });
        }
        if (mode === "gravity" && travel > 22) {
          travel = 0;
          const near = nearestLayer(c, p.x, p.y);
          stamps.push({
            L: near.L, x: p.x, y: p.y, vx: (p.x - lastX) * 0.8, vy: -2.2 * S,
            rot: 0, vr: (rnd() - 0.5) * 10, life: 1, kind: "fall",
          });
        }
        if (mode === "emit" && step > 2) {
          const n = 2 + ((c.cfg.ghosts ?? 7) / 4 | 0);
          for (let i = 0; i < n; i++) {
            const a = rnd() * Math.PI * 2;
            const sp = (1.2 + rnd() * 2.4) * S;
            stamps.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, r: 2.2 + rnd() * 2, kind: "emit" });
          }
        }
        lastX = p.x; lastY = p.y;
      }
      for (let i = pts.length - 1; i >= 1; i--) {
        const k = mode === "goo" ? 0.28 : 0.34;
        pts[i].x += (pts[i - 1].x - pts[i].x) * k * f;
        pts[i].y += (pts[i - 1].y - pts[i].y) * k * f;
      }
      if (mode === "goo" && pts.length) {
        g.globalAlpha = amt;
        pts.forEach((q, i) => {
          const r = (18 - i * 0.32) * scale;
          if (r < 3) return;
          g.fillStyle = INK;
          g.beginPath(); g.arc(q.x, q.y, r, 0, Math.PI * 2); g.fill();
        });
        g.globalCompositeOperation = "destination-out";
        pts.forEach((q, i) => {
          const r = (10 - i * 0.22) * scale;
          if (r < 1.5) return;
          g.beginPath(); g.arc(q.x, q.y, r, 0, Math.PI * 2); g.fill();
        });
        g.globalCompositeOperation = "source-over";
        g.globalAlpha = 1;
      } else if (mode === "ribbon" && pts.length > 1) {
        g.globalAlpha = amt;
        g.fillStyle = INK;
        g.beginPath();
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i + 1];
          const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
          const w = (7 - i * 0.22) * scale * S;
          const nx = -dy / len * w, ny = dx / len * w;
          if (i === 0) g.moveTo(a.x + nx, a.y + ny);
          g.lineTo(b.x + nx, b.y + ny);
        }
        for (let i = pts.length - 1; i > 0; i--) {
          const a = pts[i], b = pts[i - 1];
          const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
          const w = (7 - (i - 1) * 0.22) * scale * S;
          const nx = -dy / len * w, ny = dx / len * w;
          g.lineTo(a.x - nx, a.y - ny);
        }
        g.closePath(); g.fill();
        g.globalAlpha = 1;
      } else if (mode === "rgb" && pts.length) {
        const cols = ["#e23a3a", "#2fa36a", "#2a62d4"];
        g.globalAlpha = 0.55 * amt;
        cols.forEach((col, ci) => {
          g.fillStyle = col;
          const off = (ci - 1) * (c.cfg.fringe ?? 7);
          pts.forEach((q, i) => {
            const r = (9 - i * 0.16) * scale;
            if (r < 2) return;
            g.beginPath(); g.arc(q.x + off, q.y + off * 0.35, r, 0, Math.PI * 2); g.fill();
          });
        });
        g.globalAlpha = 1;
      } else if (mode === "comet" && pts.length) {
        g.save();
        g.beginPath();
        pts.forEach((q, i) => {
          const r = (22 - i * 0.4) * scale;
          if (r < 2) return;
          g.moveTo(q.x + r, q.y);
          g.arc(q.x, q.y, r, 0, Math.PI * 2);
        });
        g.clip();
        g.filter = "invert(1) hue-rotate(40deg)";
        g.drawImage(c.composite(), 0, 0, c.W, c.H);
        g.filter = "none";
        g.restore();
        g.globalAlpha = amt;
      } else if (mode === "harmony" && pts.length) {
        g.strokeStyle = INK;
        g.globalAlpha = 0.28 * amt;
        g.lineWidth = 0.8;
        const lim = 22 * scale;
        for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
          const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
          const d = Math.hypot(dx, dy);
          if (d > 2 && d < lim) {
            g.beginPath();
            g.moveTo(pts[i].x + dy * 0.04, pts[i].y - dx * 0.04);
            g.lineTo(pts[j].x, pts[j].y);
            g.stroke();
          }
        }
        g.globalAlpha = amt;
        g.fillStyle = INK;
        if (pts[0]) { g.beginPath(); g.arc(pts[0].x, pts[0].y, 3.2, 0, Math.PI * 2); g.fill(); }
        g.globalAlpha = 1;
      } else if (mode === "feedback") {
        const fg = fade.getContext("2d");
        fg.setTransform(1, 0, 0, 1, 0, 0);
        fg.globalAlpha = c.cfg.decay ?? 0.92;
        fg.drawImage(fade, 1.2, 1.2, fade.width - 2.4, fade.height - 2.4);
        fg.globalAlpha = 1;
        if (p.inside) {
          fg.setTransform(DPR, 0, 0, DPR, 0, 0);
          fg.fillStyle = INK;
          fg.globalAlpha = 0.55;
          fg.beginPath(); fg.arc(p.x, p.y, 10 * scale * S, 0, Math.PI * 2); fg.fill();
          fg.globalAlpha = 1;
        }
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.globalAlpha = amt;
        g.drawImage(fade, 0, 0);
        g.globalAlpha = 1;
      }
      stamps = stamps.filter((s) => s.life > 0.03);
      stamps.forEach((s) => {
        if (s.kind === "smoke") {
          s.r += 0.55 * f; s.life -= (c.cfg.fade ?? 0.014) * 2 * f; s.y -= 0.25 * f;
          g.globalAlpha = s.life * amt * 0.45;
          g.fillStyle = INK;
          g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI * 2); g.fill();
        } else if (s.kind === "stamp") {
          s.life -= 0.022 * f;
          g.globalAlpha = s.life * amt;
          g.fillStyle = INK;
          g.beginPath(); g.arc(s.x, s.y, s.r * (0.7 + 0.3 * s.life), 0, Math.PI * 2); g.fill();
        } else if (s.kind === "fall") {
          s.vy += (c.cfg.gravity ?? 0.34) * 0.55 * f;
          s.x += s.vx * f; s.y += s.vy * f; s.rot += s.vr * f;
          if (s.y > c.H - 18) { s.y = c.H - 18; s.vy *= -0.45; s.life -= 0.08; }
          s.life -= 0.006 * f;
          g.save();
          g.globalAlpha = Math.min(1, s.life) * amt;
          g.translate(s.x, s.y); g.rotate(s.rot * Math.PI / 180);
          if (s.L) {
            const z = 0.45;
            g.drawImage(s.L.c, -s.L.w * z / 2, -s.L.h * z / 2, s.L.w * z, s.L.h * z);
          } else {
            g.fillStyle = INK; g.fillRect(-8, -5, 16, 10);
          }
          g.restore();
        } else if (s.kind === "emit") {
          s.x += s.vx * f * 6; s.y += s.vy * f * 6; s.life -= 0.03 * f;
          g.globalAlpha = s.life * amt;
          g.fillStyle = INK;
          g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI * 2); g.fill();
        }
      });
      g.globalAlpha = 1;
      if (p.inside && (mode === "goo" || mode === "ribbon" || mode === "rgb" || mode === "emit")) {
        g.fillStyle = INK;
        g.globalAlpha = amt;
        g.beginPath(); g.arc(p.x, p.y, 3.4 * scale, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1;
      }
      return p.inside || amt > 0.02 || stamps.length > 0;
    },
  };
}

const grid = document.getElementById("grid");
const cards = EFFECTS.map((d, i) => { const c = new Card(d, i); grid.appendChild(c.el); return c; });

function fadeSwap(target, fn, out = 150, inn = 220) {
  const els = Array.isArray(target) ? target : [target];
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { fn(); return; }
  els.forEach((e) => { e.classList.remove("is-in"); e.classList.add("fade-swap", "is-out"); e.style.transitionDuration = out + "ms"; });
  setTimeout(() => {
    fn();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      els.forEach((e) => { e.style.transitionDuration = inn + "ms"; e.classList.add("is-in"); e.classList.remove("is-out"); });
      setTimeout(() => els.forEach((e) => { e.classList.remove("fade-swap", "is-in"); e.style.transitionDuration = ""; }), inn + 40);
    }));
  }, out);
}
const pending = new Set();
let pumping = false;
const inView = (c) => { const r = c.el.getBoundingClientRect(); return r.width > 0 && r.bottom > 0 && r.top < innerHeight; };
function pump() {
  if (pumping) return;
  pumping = true;
  requestAnimationFrame(function step() {
    let pick = null;
    for (const c of pending) { if (c.visible) { pick = c; break; } }
    if (!pick) pick = pending.values().next().value;
    if (!pick) { pumping = false; return; }
    pending.delete(pick);
    if (pick.el.offsetParent !== null) pick.rebuild();
    requestAnimationFrame(step);
  });
}
function rebuildAll() {
  let now = 0;
  cards.forEach((c) => {
    c.stale = true;
    if (now < 7 && inView(c)) { now++; pending.delete(c); c.rebuild(); }
    else pending.add(c);
  });
  pump();
}

const io = new IntersectionObserver((es) => es.forEach((e) => {
  const card = cards.find((c) => c.stage === e.target.querySelector(".stage"));
  if (card) { card.visible = e.isIntersecting; if (e.isIntersecting) { card.dirty = true; if (card.stale) { pending.add(card); pump(); } } }
}), { threshold: 0.01 });
cards.forEach((c) => io.observe(c.el));

let resizeTimer;
new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(rebuildAll, 150); }).observe(grid);

  // #endregion
}
function moveSegPill(seg, animate) {
  const pill = seg.querySelector(".seg-pill");
  const btn = seg.querySelector("[aria-pressed=true]");
  if (!pill || !btn) return;
  const x = btn.offsetLeft, y = btn.offsetTop, w = btn.offsetWidth, h = btn.offsetHeight;
  const before = pill.getBoundingClientRect();
  const segRect = seg.getBoundingClientRect();
  const sx = !w || Math.abs(before.width - w) < 0.5 ? 1 : before.width / w;
  const sy = !h || Math.abs(before.height - h) < 0.5 ? 1 : before.height / h;
  debugPill("A", "index.html:moveSegPill", "measure", {
    id: seg.id, animate, x, y, w, h, sx: +sx.toFixed(3), sy: +sy.toFixed(3),
    beforeW: Math.round(before.width), beforeH: Math.round(before.height),
    inlineW: pill.style.width, transition: pill.style.transition || "css",
    fonts: document.fonts.status, t: Math.round(performance.now())
  });
  const place = (tx, ty, scx, scy) => {
    pill.style.width = w + "px";
    pill.style.height = h + "px";
    pill.style.transform = `translate(${tx}px, ${ty}px) scale(${scx}, ${scy})`;
  };
  pill.style.transition = "none";
  if (!animate || before.width < 1) {
    place(x, y, 1, 1);
  } else {
    place(before.left - segRect.left, before.top - segRect.top, sx, sy);
  }
  void pill.offsetWidth;
  pill.style.removeProperty("transition");
  if (animate && before.width >= 1) place(x, y, 1, 1);
  pill.classList.add("is-ready");
  if (!pill.dataset.debugBound) {
    pill.dataset.debugBound = "1";
    pill.addEventListener("transitionrun", (e) => {
      if (e.propertyName !== "width" && e.propertyName !== "height" && e.propertyName !== "transform") return;
      const on = seg.querySelector("[aria-pressed=true]");
      debugPill("B", "index.html:transitionrun", "pill transition", {
        id: seg.id, prop: e.propertyName,
        pillW: pill.offsetWidth, pillH: pill.offsetHeight,
        btnW: on ? on.offsetWidth : null, btnH: on ? on.offsetHeight : null,
        t: Math.round(performance.now())
      });
    });
  }
}
function afterPillPaint(seg, fn) {
  const pill = seg.querySelector(".seg-pill");
  const dur = pill ? getComputedStyle(pill).transitionDuration : "0s";
  if (!pill || matchMedia("(prefers-reduced-motion: reduce)").matches || dur === "0s") {
    requestAnimationFrame(() => requestAnimationFrame(fn));
    return;
  }
  let done = false;
  const finish = (via) => {
    if (done) return;
    done = true;
    pill.removeEventListener("transitionend", onEnd);
    // #region agent log
    debugPill("D", "index.html:afterPillPaint", "follow-up", { id: seg.id, via, t: Math.round(performance.now()) });
    // #endregion
    fn();
  };
  const onEnd = (e) => { if (e.target === pill && e.propertyName === "transform") finish("transitionend"); };
  pill.addEventListener("transitionend", onEnd);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => setTimeout(() => finish("timeout"), 320));
  });
}

document.querySelectorAll("#subject button").forEach((b) => b.addEventListener("click", () => {

}
document.querySelectorAll("#family button").forEach((b) => b.addEventListener("click", () => {

document.querySelectorAll("#density button").forEach((b) => b.addEventListener("click", () => {
  if (b.getAttribute("aria-pressed") === "true") return;

  const seg = b.closest(".seg");
  moveSegPill(seg, true);

    fadeSwap(grid, () => {
      grid.style.gridTemplateColumns = `repeat(auto-fill, minmax(${b.dataset.v}px, 1fr))`;
      rebuildAll();

}));
const bind = (id, fn) => document.getElementById(id).addEventListener("input", (e) => fn(e.target));
bind("radius", (el) => {
  document.getElementById("radiusV").textContent = String(el.value).padStart(3, " ");
  cards.forEach((card) => card.setCfg({ radius: +el.value }));
});
bind("strength", (el) => {
  const v = +el.value / 100;
  document.getElementById("strengthV").textContent = v.toFixed(1);
  cards.forEach((card) => card.setCfg({ strength: v }));
});
bind("ring", (el) => { params.ring = el.checked; });

let last = performance.now();
function frame(now) {
  const f = Math.min((now - last) / 16.667, 2); last = now;
  const t = now / 1000;
  for (const c of cards) {
    if (!c.visible || !c.fx) continue;
    c.updatePointer(t);
    if (c.ptr.inside || c.alive || c.dirty) { c.dirty = false; c.alive = c.fx.step(f, t); }
  }
  requestAnimationFrame(frame);
}

Promise.all([
  ...LOGOS.map((l) => loadImage(l.src)),
  document.fonts.load('400 64px "Uncut Sans"'),
  document.fonts.load('italic 700 64px "Nyght Serif"'),
]).then((results) => {
  logoImages = results.slice(0, LOGOS.length);
  rebuildAll();
  requestAnimationFrame(frame);
});
